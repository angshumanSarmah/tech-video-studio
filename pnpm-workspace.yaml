packages:
  - apps/*
  - packages/*

# Single source of truth for dependency versions across the workspace.
catalog:
  # runtime
  hono: ^4.13.19
  '@hono/node-server': ^2.1.9
  vue: ^3.5.45
  vue-router: ^5.5.1
  pinia: ^4.1.0
  zod: ^4.6.7
  # db: stable 0.45 line; 1.0 changes migration folder format and relations API (see docs/TODO.md)
  drizzle-orm: ^0.45.4
  better-sqlite3: ^13.2.0
  # renderer: every remotion/@remotion/* package must share one exact version
  remotion: 4.0.540
  '@remotion/cli': 4.0.540
  '@remotion/fonts': 4.0.540
  '@remotion/bundler': 4.0.540
  '@remotion/renderer': 4.0.540
  react: 19.2.9
  react-dom: 19.2.9
  # formula_card (LaTeX); its fonts are bundled from the package by Remotion's webpack
  katex: ^0.19.1
  # seed asset library: icon data (ISC; licence in packages/renderer/src/assets/LICENSE-lucide.txt)
  lucide: ^1.74.0
  # full Lucide import (P1C.12): icon tags for the asset manifest script; exact, it must match
  # the lucide version the committed manifest was built from
  lucide-static: 1.74.0
  # house SVG parser for asset files (renderer catalog; reused by the P1C.12 sanitizer)
  fast-xml-parser: ^5.9.3
  # source ingestion (P1C.2): article extraction on jsdom, PDF text via pdf.js
  '@mozilla/readability': ^0.6.0
  unpdf: ^2.2.1
  # .docx uploads (P1C.2): document body as HTML, then the same text writer as web pages
  mammoth: ^1.13.0
  '@types/jsdom': ^30.0.0
  # fonts: subsetting script + glyph coverage test (fontkit 3 is younger than minimumReleaseAge)
  subset-font: ^2.9.0
  fontkit: ^2.0.4
  '@types/fontkit': ^2.0.9
  # build / dev
  '@vitejs/plugin-vue': ^6.0.11
  concurrently: ^10.0.7
  tsup: ^9.0.0
  tsx: ^4.23.15
  drizzle-kit: ^0.31.11
  '@types/better-sqlite3': ^9.6.0
  vite: ^8.3.8
  tailwindcss: ^4.3.5
  '@tailwindcss/vite': ^4.3.5
  # TypeScript pinned to 6.0.x: typescript-eslint 8 supports <6.1 (see docs/TODO.md)
  typescript: ~6.0.3
  vue-tsc: ^3.3.14
  '@types/node': ^24.19.2
  '@types/react': ^19.3.0
  '@types/react-dom': ^19.3.0
  # test
  # exact pin: 5.1.1 is younger than pnpm's minimumReleaseAge gate
  vitest: 5.1.0
  jsdom: ^31.0.1
  '@vue/test-utils': ^2.6.0
  # lint / format
  '@eslint/js': ^10.0.1
  eslint: ^10.15.0
  eslint-config-prettier: ^10.1.8
  eslint-plugin-vue: ^10.12.1
  globals: ^17.14.0
  prettier: ^3.10.1
  typescript-eslint: ^8.73.0
  vue-eslint-parser: ^10.4.2

# Dependencies allowed to run install scripts.
allowBuilds:
  better-sqlite3: true
  esbuild: true
